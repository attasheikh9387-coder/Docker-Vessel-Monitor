services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: shiptrack
      POSTGRES_USER: shiptrack
      POSTGRES_PASSWORD: shiptrack_dev_password
    ports:
      - "5432:5432"
    volumes:
      - shiptrack-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiptrack -d shiptrack"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://shiptrack:shiptrack_dev_password@postgres:5432/shiptrack
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.telemetry
    command: ["python", "worker.py"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://shiptrack:shiptrack_dev_password@postgres:5432/shiptrack
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  simulator:
    build:
      context: .
      dockerfile: Dockerfile.telemetry
    command: ["python", "simulator.py"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  shiptrack-postgres-data:
    external: true
    name: shiptrack-postgres-data
